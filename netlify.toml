[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Skip Netlify rebuild when only the queue JSON changed —
# live updates are handled via GitHub Gist instead.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!data/waiting-list.json'"
